[package]
name = "copilot-proxy"
version = "1.0.0"
edition = "2024"
description = "OpenAI-compatible HTTP proxy for GitHub Copilot"
license = "MIT"
authors = ["An Nguyen <annguyen.apps@gmail.com>"]
repository = "https://github.com/antruongnguyen/github-copilot-proxy"
keywords = ["copilot", "proxy", "openai", "github"]
categories = ["network-programming", "web-programming"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
open = "5"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
