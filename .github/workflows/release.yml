name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: copilot-proxy-darwin-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: copilot-proxy-darwin-amd64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: copilot-proxy-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: copilot-proxy-linux-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: copilot-proxy-windows-amd64.zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: copilot-proxy-windows-arm64.zip

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} copilot-proxy
          cd ../../..
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/copilot-proxy.exe" -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ASCII "${{ matrix.archive }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            copilot-proxy-darwin-arm64.tar.gz
            copilot-proxy-darwin-arm64.tar.gz.sha256
            copilot-proxy-darwin-amd64.tar.gz
            copilot-proxy-darwin-amd64.tar.gz.sha256
            copilot-proxy-linux-amd64.tar.gz
            copilot-proxy-linux-amd64.tar.gz.sha256
            copilot-proxy-linux-arm64.tar.gz
            copilot-proxy-linux-arm64.tar.gz.sha256
            copilot-proxy-windows-amd64.zip
            copilot-proxy-windows-amd64.zip.sha256
            copilot-proxy-windows-arm64.zip
            copilot-proxy-windows-arm64.zip.sha256
